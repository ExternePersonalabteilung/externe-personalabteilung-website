    // document mints the blobs for its OWN frames, obtaining page text

    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

top:16px;text-align:center;\">\n            <a href=\"#weitere-vorteile\" style=\"display:inline-block;padding:14px 26px;border-radius:16px;font-family:'Marcellus',serif;font-size:17px;line-height:1.25;text-decoration:none;color:#3a2408;background:linear-gradient(160deg,#fbe6a6,#f0c45c 55%,#c98a2f);border:1px solid rgba(255,243,212,.7);box-shadow:0 12px 30px rgba(120,80,10,.4),inset 0 1px 0 rgba(255,255,255,.7);\">Wir finden definitiv Ihren Mitarbeiter!<\u002Fa>\n            <span style=\"font-family:'Caveat',cursive;font-size:30px;line-height:1;color:#8a5c10;\">LG Anita Bösche<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:clamp(15px,1.9vw,17px);color:#5a3a16;margin:0 0 22px;max-width:580px;line-height:1.7;\">Ich unterstütze kleine und mittelständische Unternehmen dabei, offene Stellen sichtbar, attraktiv und bewerberfreundlich zu machen. Mit moderner Recruiting-Strategie, überzeugenden Stellenanzeigen, gezielter Kandidatenansprache und klarer Bewerberkommunikation begleite ich Sie persönlich von der Analyse bis zur passenden Besetzung.<\u002Fp>\n        <blockquote style=\"position:relative;margin:0 0 22px;padding:20px 24px 20px 28px;border-radius:16px;background:linear-gradient(160deg, rgba(255,251,242,.92), rgba(250,239,213,.82));border:1px solid rgba(201,138,47,.5);box-shadow:0 10px 26px rgba(120,80,10,.16), inset 0 1px 0 rgba(255,255,255,.7);max-width:min(560px,46vw);\">\n          <span style=\"position:absolute;top:4px;left:12px;font-family:'Marcellus',serif;font-size:42px;color:rgba(201,138,47,.45);line-height:1;\">“<\u002Fspan>\n          <p style=\"font-family:'Marcellus',serif;font-style:italic;font-size:clamp(14.5px,1.9vw,16.5px);color:#5a3a16;margin:0;line-height:1.55;padding-left:6px;\">Ich bin wie ein Handwerker: Sie rufen mich, ich komme online in Ihr Unternehmen, repariere die offene Stelle, lasse alle Daten, Fakten und Zahlen bei Ihnen – und gehe wieder nach getaner Arbeit.<\u002Fp>\n        <\u002Fblockquote =\"round\" style=\"flex:none;\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M8 12.5l2.8 2.8L16.5 9.5\"><\u002Fpath><\u002Fsvg>\n            <p style=\"font-size:14.5px;line-height:1.55;color:#4a3210;margin:0;\"><strong style=\"color:#8a5c10;\">Ihr Nutzen:<\u002Fstrong> Sie sparen wertvolle Zeit und hinterlassen einen starken Eindruck bei Bewerbern.<\u002Fp>\n          <\u002Fdiv>\n          <a href=\"Bewerberkommunikation.dc.html\" style=\"align-self:center;margin-top:24px;display:inline-flex;align-items:center;gap:12px;padding:12px 30px;border-radius:999px;border:1.5px solid rgba(201,138,47,.75);font-size:15.5px;font-weight:600;color:#a9741a;text-decoration:none;background:rgba(255,255,255,.6);\" style-hover=\"background:#f7e7c4;color:#7a4a14;\">Mehr\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin:clamp(30px,4vw,46px) auto 0;display:flex;justify-content:center;\">\n        <a href=\"#leistungen\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 32px;border-radius:14px;font-family:'Marcellus',serif;font-size:clamp(15px,1.8vw,18px);font-weight:400;text-decoration:none;color:#3a2408;background:linear-gradient(160deg,#fbe6a6,#f0c45c 55%,#d6a23f);border:1px solid rgba(201,138,47,.7);box-shadow:0 12px 28px rgba(201,138,47,.35);\" style-hover=\"filter:brightness(1.06);\">Überblick zu meiner kompletten Leistung\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#3a2408\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <dc-import name=\"CtaBar\" hint-size=\"100%,150px\"><\u002Fdc-import>\n\n  <section data-screen-label=\"Über mich\" id=\"ueber\" style=\"max-width:1140px;margin:0 auto;padding:clamp(44px,6vw,90px) clamp(16px,4vw,40px);\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:clamp(28px,5vw,64px);\">\n      <div style=\"align-self:stretch;\"><div style=\"position:sticky;top:32px;\">\n        <div style=\"position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(201,138,47,.5);box-shadow:0 22px 60px rgba(0,0,0,.5);background:radial-gradient(110% 80% at 50% 18%, rgba(247,205,120,.45), rgba(20,12,3,.92));aspect-ratio:4/5;\">\n          <img src=\"assets/rec/r01.webp\" alt=\"Anita Bösche\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"1812\" style=\"position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:104%;width:auto;max-width:none;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 18px 34px rgba(40,22,4,.45));\">\n        <\u002Fdiv>\n        <p style=\"font-family:'Marcellus',serif;letter-spacing:4px;text-transform:uppercase;font-size:12px;color:#9a6b16;margin:26px 0 14px;\">Qualifikationen<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:9px;\">\n          <li style=\"display:flex;gap:11px;align-items:flex-start;font-size:15px;color:#cbb27e;line-height:1.6;\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c98a2f;flex:none;margin-top:8px;\"><\u002Fspan>Master Professional of Business Management (CCI)<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;font-size:15px;color:#cbb27e;line-height:1.6;\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c98a2f;flex:none;margin-top:8px;\"><\u002Fspan>IHK-geprüfte Personalkauffrau<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;font-size:15px;color:#cbb27e;line-height:1.6;\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c98a2f;flex:none;margin-top:8px;\"><\u002Fspan>AZAV-geprüfter Jobcoach<\u002Fli>\n          <li style=\"display:flex;gap:11px;align-items:flex-start;font-size:15px;color:#cbb27e;line-height:1.6;\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c98a2f;flex:none;margin-top:8px;\"><\u002Fspan>AZAV-geprüfte Jobvermittlung<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv><\u002Fdiv>\n      <div>\n        <p style=\"font-family:'Marcellus',serif;letter-spacing:5px;text-transform:uppercase;font-size:13px;color:#9a6b16;margin:0 0 14px;\">Über mich<\u002Fp>\n        <h2 style=\"font-family:'Marcellus',serif;font-weight:400;font-size:clamp(28px,4.2vw,42px);line-height:1.12;margin:0 0 18px;color:#f3e8cf;\">Anita Bösche<\u002Fh2>\n        <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 16px;line-height:1.75;\">Ich bin Personalreferentin, Recruiterin und Jobcoach mit einem klaren Blick dafür, was Unternehmen wirklich brauchen: passende Mitarbeiter, weniger Zeitverlust und Bewerber, die nicht nur fachlich, sondern auch menschlich ins Unternehmen passen.<\u002Fp>\n        <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 16px;line-height:1.75;\">Mein Weg begann im elterlichen mittelständischen Unternehmen. Deshalb kenne ich die Unternehmerseite nicht nur aus der Theorie. Ich weiß, wie viel Druck entsteht, wenn Stellen unbesetzt bleiben, Bewerbungen nicht passen oder wertvolle Zeit im Auswahlprozess verloren geht.<\u002Fp>\n        <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 26px;line-height:1.75;\">Nach meinem Studium und der Weiterbildung zur Personalkauffrau war ich in verschiedenen Unternehmen als Personalreferentin tätig. Besonders geprägt hat mich meine Zeit in der Zeitarbeit als Personalberaterin. Dort zählte nicht langes Reden, sondern das Ergebnis: Menschen finden, einschätzen, vorbereiten und erfolgreich in Arbeit bringen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(32px,4.5vw,56px);\">\n      <h3 style=\"font-family:'Marcellus',serif;font-weight:400;font-size:clamp(22px,3vw,28px);color:#f3e8cf;margin:0 0 14px;\">Ihr Nutzen als Unternehmen<\u002Fh3>\n      <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 16px;line-height:1.75;\">Ich denke nicht nur wie eine Recruiterin, sondern auch wie eine Unternehmerin. Ich sehe hinter einer offenen Stelle nicht nur eine Stellenanzeige, sondern auch den Druck im Betrieb, die Mehrarbeit im Team, die Kosten durch Leerlauf und die Sorge, am Ende wieder die falsche Person einzustellen.<\u002Fp>\n      <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 22px;line-height:1.75;\">Deshalb unterstütze ich Unternehmen dabei, Stellen klarer zu beschreiben, passende Kandidaten gezielter anzusprechen und Bewerber professionell durch den Prozess zu begleiten. So sparen Sie Zeit, vermeiden unnötige Streuverluste und erhöhen die Chance, Menschen zu finden, die wirklich zu Ihrem Unternehmen passen.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;\">\n        <span style=\"padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;color:#f3e8cf;background:rgba(201,138,47,.16);border:1px solid rgba(201,138,47,.4);\">AZAV-zertifiziert<\u002Fspan>\n        <span style=\"padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;color:#f3e8cf;background:rgba(201,138,47,.16);border:1px solid rgba(201,138,47,.4);\">AVGS &amp; MPAV geeignet<\u002Fspan>\n        <span style=\"padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;color:#f3e8cf;background:rgba(201,138,47,.16);border:1px solid rgba(201,138,47,.4);\">DSGVO-konform<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(32px,4.5vw,56px);\">\n      <h3 style=\"font-family:'Marcellus',serif;font-weight:400;font-size:clamp(22px,3vw,28px);color:#f3e8cf;margin:0 0 14px;\">Was mich besonders macht<\u002Fh3>\n      <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0 0 16px;line-height:1.75;\">Ich kenne beide Seiten: die Unternehmensseite und die Bewerberseite. Ich weiß, was Unternehmer nachts wachhält, wenn Stellen unbesetzt bleiben. Und ich weiß, was Bewerber brauchen, damit sie Vertrauen fassen, Motivation entwickeln und sich wirklich bewerben.<\u002Fp>\n      <p style=\"font-size:clamp(15px,1.9vw,17px);color:#cbb27e;margin:0;line-height:1.75;\">Diese Mischung aus Recruiting-Erfahrung, Unternehmerblick und echtem Menschenverständnis macht meine Arbeit aus: praxisnah, direkt, wertschätzend und mit dem Ziel, Unternehmen und passende Mitarbeiter wirklich zusammenzubringen.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<dc-import name=\"CtaBar\" hint-size=\"100%,150px\"><\u002Fdc-import>\n\n  <section data-screen-label=\"Leistungen\" id=\"leistungen\" style=\"position:relative;background:linear-gradient(180deg,#fbf4e4 0%,#f6ead0 100%);border-top:1px solid rgba(201,138,47,.3);border-bottom:1px solid rgba(201,138,47,.3);overflow:hidden;\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(680px 460px at 82% -4%, rgba(243,201,107,.35), transparent 62%),radial-gradient(620px 420px at 8% 104%, rgba(214,162,63,.22), transparent 60%);\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1240px;margin:0 auto;padding:clamp(44px,6vw,88px) clamp(16px,4vw,40px);\">\n      <p style=\"font-family:'Marcellus',serif;letter-spacing:5px;text-transform:uppercase;font-size:13px;color:#9a6b16;margin:0 0 14px;text-align:center;\">Recruiting, Personalgewinnung &amp; HR-Unterstützung<\u002Fp>\n      <h2 style=\"font-family:'Marcellus',serif;font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.12;margin:0 auto 12px;color:#46290a;text-align:center;max-width:760px;\">Meine Leistungen im Überblick<\u002Fh2>\n      <p style=\"font-size:clamp(15px,1.9vw,17px);color:#7a4a14;margin:0 auto;max-width:600px;text-align:center;line-height:1 ecruiting?', a: 'Recruiting bezeichnet die gezielte Suche und Auswahl neuer Mitarbeiterinnen und Mitarbeiter. Ausgangspunkt ist eine offene Stelle, die mit einer fachlich und persönlich passenden Person besetzt werden soll. Dazu gehören die Stellenanalyse, die Gestaltung der Stellenanzeige, die Auswahl geeigneter Recruiting-Kanäle und das anschließende Bewerbermanagement.' },\n      { q: 'Für welche Unternehmen bieten Sie Recruiting an?', a: 'Ich unterstütze vor allem kleine und mittelständische Unternehmen bei der Personalsuche. Die Zusammenarbeit eignet sich für Unternehmen, die keine eigene Personalabteilung haben oder zusätzliche Unterstützung bei einer schwierigen Stellenbesetzung benötigen. Die Suche kann regional oder deutschlandweit erfolgen.' },\n      { q: 'Wie beginnt die Zusammenarbeit?', a: 'Wir starten mit einem kostenlosen 15- bis 30-minütigen Erstgespräch. Dabei finden wir gemeinsam heraus, ob und wie ich Ihnen bei der Besetzung Ihrer offenen Stelle helfen kann. Im zweiten Gespräch gehen wir detailliert auf die Aufgaben, Anforderungen und Rahmenbedingungen der Position ein.' },\n      { q: 'Wie läuft die Personalsuche ab?', a: 'Zunächst analysieren wir die offene Stelle und die bisherigen Recruiting-Erfahrungen. Danach überprüfen wir den Arbeitgeberauftritt, mögliche Mitarbeitervorteile, das Gehalt, die Konkurrenzsituation und das Bewerbungsverfahren. Auf dieser Grundlage erstellen wir einen stufenweisen Ausschreibungsplan. Sobald Bewerbungen eingehen, beginnt das Bewerbermanagement.' },\n      { q: 'Prüfen Sie auch bisherige Recruiting-Maßnahmen?', a: 'Ja. Wir schauen gemeinsam zurück: Was wurde bereits ausprobiert? Welche Maßnahmen brachten keine geeigneten Bewerbungen? Über welche Wege konnten frühere Stellen erfolgreich besetzt werden? Dadurch vermeiden wir unnötige Wiederholungen und können den neuen Ausschreibungsplan gezielter aufbauen.' },\n      { q: 'Unterstützen Sie beim Employer Branding?', a: 'Ja. Bei Bedarf erstelle oder überarbeite ich Ihren Arbeitgeberauftritt. Dabei achten wir darauf, dass Bewerberinnen und Bewerber schnell erkennen, wofür Ihr Unternehmen steht, was die offene Stelle bietet und warum sich eine Bewerbung bei Ihnen lohnt.' },\n      { q: 'Helfen Sie bei der Entwicklung von Benefits?', a: 'Ja. Gemeinsam prüfen wir, welche Mitarbeitervorteile bereits vorhanden sind und welche zusätzlichen Benefits ohne großen Aufwand angeboten werden können. Dafür nutze ich eine vierseitige Ideensammlung mit unterschiedlichen Möglichkeiten für kleine und mittelständische Unternehmen.' },\n      { q: 'Wie wird das Bewerbungsverfahren vereinfacht?', a: 'Wir prüfen, wie sich Interessierte schnell und unkompliziert bewerben können. Unnötig lange Formulare oder komplizierte Abläufe können geeignete Kandidatinnen und Kandidaten abschrecken. Deshalb entwickeln wir ein Bewerbungsverfahren, das zum Unternehmen und zur gesuchten Zielgruppe passt.' },\n      { q: 'Welche Recruiting-Kanäle werden genutzt?', a: 'Die Auswahl richtet sich nach der Stelle und der Zielgruppe. Die Suche kann beispielsweise mit kostenfreien Multiposting-Portalen, einem PDF-Aushang im Unternehmen und weiteren geeigneten Möglichkeiten beginnen. Bei Bedarf erweitern wir den Ausschreibungsplan schrittweise um kostenpflichtige Jobportale, Printmedien oder andere Recruiting-Kanäle.' },\n      { q: 'Wie lange dauert eine Stellenbesetzung?', a: 'Bis geeignete Bewerbungen eingehen, vergehen häufig zwei bis vier Monate. Danach folgen Vorstellungsgespräche, Auswahlverfahren und die Kündigungsfrist des ausgewählten Kandidaten. Auch bereits geplanter Urlaub kann den Arbeitsbeginn verzögern. Vom Veröffentlichen der Stellenanzeige bis zum ersten Arbeitstag sind sechs bis acht Monate deshalb häufig realistisch.' },\n      { q: 'Welche Stellen lassen sich schneller besetzen?', a: 'Kaufmännische Stellen, Helfer- und Einstiegspositionen sowie einige Positionen für Masterabsolventen und Promovierte können teilweise innerhalb weniger Tage besetzt werden. Bei spezialisierten Fachkräften, besonders im Handwerk und in bestimmten Dienstleistungsbereichen, kann die Suche dagegen vier Monate bis eineinhalb Jahre dauern.' },\n      { q: 'Warum kommen geeignete Bewerbungen häufig erst später?', a: 'Viele geeignete Kandidatinnen und Kandidaten befinden sich noch in einem bestehenden Arbeitsverhältnis. Sie entdecken eine Stellenanzeige, denken über einen Wechsel nach und lesen das Angebot später erneut. Häufig entsteht erst nach sechs bis acht Wochen die Motivation, sich tatsächlich zu bewerben. Eine Stellenanzeige ist deshalb nicht automatisch erfolglos, wenn in den ersten Tagen keine Bewerbungen eingehen.' },\n      { q: 'Ist eine Printanzeige erfolgreich, wenn sich erst nach drei Wochen jemand meldet?', a: 'Ja. Besonders bei einer Stellenanzeige in einer Zeitung kann eine erste geeignete Bewerbung nach ungefähr drei Wochen immer noch ein gutes Ergebnis sein. Bewerbungen direkt am folgenden Tag sind möglich, aber nicht der Normalfall. Entscheidend ist, ob die Anzeige die richtigen Kandidatinnen und Kandidaten erreicht.' },\n      { q: 'Wird die Wartezeit berechnet?', a: 'Nein. Nach der Veröffentlichung benötigt die Personalsuche Zeit. Die reine Wartezeit, in der keine aktive Leistung erbracht wird, ist für Sie kostenfrei. Berechnet wird ausschließlich der tatsächlich entstandene Arbeitsaufwand.' },\n      { q: 'Was kostet Recruiting bei Ihnen?', a: 'Die Kosten richten sich nach dem tatsächlichen Aufwand und den Anforderungen der offenen Stelle. Die Gesamtkosten für eine Erstbesetzung liegen erfahrungsgemäß bei etwa 850 bis 5.000 Euro. Weitere Stellenbesetzungen im selben Unternehmen sind häufig deutlich günstiger und kosten insgesamt etwa 300 bis 3.000 Euro, weil wichtige Grundlagen bereits vorhanden sind. Abgerechnet wird ausschließlich auf Honorarbasis nach dem tatsächlich entstandenen Zeitaufwand. Die reine Wartezeit nach Veröffentlichung der Stellenanzeige ist kostenfrei.' },\n      { q: 'Erhalte ich als Auftraggeber alle Daten, Zugänge und Bewerbungen?', a: 'Ja. Als Auftraggeber erhalten Sie alle Bewerbungen, Bewerberdaten, Unterlagen, Zugänge, Job-Accounts und erstellten Materialien. Die Recruiting-Kanäle werden mit Ihrer E-Mail-Adresse und Ihren Zugangsdaten eingerichtet. Dadurch können Sie jederzeit selbst auf alle Informationen zugreifen. Sämtliche Daten und Zugänge bleiben in Ihrem Unternehmen und Sie bleiben vollständig unabhängig.' },\n      { q: 'Gibt es eine staatliche Förderung für das Recruiting?', a: 'Für Unternehmen können unter bestimmten Voraussetzungen Fördermöglichkeiten bestehen. Ob und in welcher Höhe eine Förderung möglich ist, hängt vom jeweiligen Förderprogramm und den Voraussetzungen des Unternehmens ab. Deshalb wird eine mögliche Förderung immer individuell und anhand der aktuell gültigen Bedingungen geprüft.' },\n      { q: 'Welche Recruiting-Erfahrung hat Anita Bösche?', a: 'Anita Bösche verfügt über rund 15 Jahre Erfahrung im Recruiting und Personalwesen. In dieser Zeit hat sie nach eigener, vorsichtiger Schätzung etwa 780 vakante Stellen erfolgreich besetzt. Rund 98 Prozent der von ihr übernommenen Stellen konnten mit einer neuen Mitarbeiterin oder einem neuen Mitarbeiter besetzt werden.' }\n    ];\n\n    const faqStats = [\n      { label: '15 Jahre Recruiting-Erfahrung', icon: { __html: '<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#a9741a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18\"><\u002Fpath><\u002Fsvg>' } },\n      { label: 'ca. 780 Stellen erfolgreich besetzt', icon: { __html: '<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#a9741a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6 1.2 0 2.3.35 3.2.95\"><\u002Fpath><circle cx=\ ],\n      ['Alle Daten und Zugänge bleiben bei Ihnen', 'Alle erarbeiteten Texte, Unterlagen, Bilder, Daten, Auswertungen und Zugänge bleiben in Ihrem Unternehmen.'],\n      ['Keine Abhängigkeit', 'Sie bleiben jederzeit flexibel und unabhängig. Ziel ist es, funktionierende und dauerhaft nutzbare Strukturen in Ihrem Unternehmen aufzubauen.'],\n      ['Wiederverwendbare Recruiting-Materialien', 'Einmal professionell erstellte Stellenanzeigen, Bilder, Texte, Prozesse und Analysen können Sie später schnell anpassen und erneut nutzen.'],\n      ['Kosteneinsparung bei Nachbesetzung', 'Bei einer späteren ähnlichen Besetzung greifen wir auf bewährte Unterlagen, frühere Erkenntnisse und vorhandene Strukturen zurück. Dadurch startet die neue Suche schneller und kostengünstiger.'],\n      ['Zufriedenere Kunden', 'Wenn Ihr Team wieder vollständig und leistungsfähig ist, können Sie Termine, Qualität und Service zuverlässiger einhalten.'],\n      ['Projekte kommen wieder voran', 'Mit der passenden Besetzung entstehen neue Kapazitäten, klare Zuständigkeiten und wieder spürbare Bewegung in Ihren Projekten.'],\n      ['Neue Aufträge', 'Durch zusätzliche Kapazitäten gewinnen Sie wieder die Möglichkeit, neue Kunden zu bedienen, Aufträge anzunehmen und Marktchancen zu nutzen.'],\n      ['Wachstum', 'Eine neue oder passend nachbesetzte Stelle schafft nicht nur Entlastung, sondern auch neue unternehmerische Möglichkeiten.'],\n      ['Struktur und Sicherheit', 'Aus Unsicherheit wird ein klarer Plan, aus Überlastung wird Entlastung. Aus Ihrer offenen Stelle wird eine echte Chance für Stabilität, Zufriedenheit und Wachstum.']\n    ];\n    const ai = (inner) => ({ __html: '<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#a9741a\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' + inner + '<\u002Fsvg>' });\n    const advIcons = [\n      ai('<path d=\"M12 3c3.2 1.6 5 4.8 5 8.5L15 16H9l-2-4.5C7 7.8 8.8 4.6 12 3z\"/><circle cx=\"12\" cy=\"9\"
