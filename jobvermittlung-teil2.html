document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2px,4.2vw,60px) clamp(18px,3.2vw,48px);background:radial-gradient(125% 95% at 50% -5%, #fbf6ea 0%, #f3e9d6 55%, #ecdfc6 100%);border:1.5px solid #ecdcae;box-shadow:0 14px 36px rgba(120,90,10,.10);\">\n    <style>\n      .faq-item summary::-webkit-details-marker{display:none;}\n      .faq-item summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:20px 24px;font-family:'Marcellus',serif;font-weight:400;font-size:clamp(17px,1.7vw,20px);line-height:1.3;color:#5a3a16;outline:none;}\n      .faq-item summary:hover{color:#7a4a1e;}\n      .faq-q{flex:1;min-width:0;}\n      .faq-chev{flex:0 0 auto;color:#b07d10;transition:transform .28s ease;}\n      .faq-item[open] .faq-chev{transform:rotate(180deg);}\n      .faq-item[open] summary{color:#7a4a1e;}\n      .faq-body{padding:2px 24px 22px;font-size:15px;line-height:1.72;color:#4a3620;}\n      .faq-body p{margin:0 0 13px;}\n      .faq-body p:last-child{margin-bottom:0;}\n      .faq-note{font-size:13px;color:#8a6a3a;font-style:italic;}\n      .faq-body ul,.faq-body ol{margin:0 0 13px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}\n      .faq-body li{display:flex;gap:12px;align-items:flex-start;}\n      .faq-body ul li::before{content:\"\";flex:0 0 auto;width:7px;height:7px;margin-top:8px;border-radius:2px;transform:rotate(45deg);background:#d9a63a;}\n      .faq-body ol{counter-reset:faqc;}\n      .faq-body ol li{counter-increment:faqc;}\n      .faq-body ol li::before{content:counter(faqc);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#e3b743,#b3850f);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}\n    <\u002Fstyle>\n    <div style=\"position:absolute;bottom:-80px;right:-60px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(201,138,18,.10),transparent 70%);filter:blur(14px);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative;text-align:center;max-width:820px;margin:0 auto clamp(28px,3.4vw,44px);\">\n      <p style=\"font-family:'Marcellus',serif;letter-spacing:4px;text-transform:uppercase;font-size:12px;color:#b07d10;margin:0 0 14px;\">FAQ<\u002Fp>\n      <h2 id=\"faq-title\" style=\"font-family:'Marcellus',serif;font-weight:400;font-size:clamp(28px,4.2vw,44px);line-height:1.1;margin:0;color:#4a2f14;\">Häufige Fragen zur Jobvermittlung<\u002Fh2>\n      <p style=\"margin:15px auto 0;font-size:clamp(15px,1.9vw,18px);font-weight:700;color:#b07d10;\">Persönlich · gezielt · diskret · professionell · deutschlandweit<\u002Fp>\n      <p style=\"margin:9px auto 0;max-width:720px;font-size:14.5px;line-height:1.55;color:#6a4a22;\">8 Jahre Erfahrung · rund 830 Menschen erfolgreich vermittelt · rund 96 % Erfolgsquote bei sozialversicherungspflichtigen Vermittlungen<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:13px;\">\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was bedeutet Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Bei der Jobvermittlung steht der jobsuchende Mensch im Mittelpunkt. Ich suche gezielt nach einer neuen sozialversicherungspflichtigen Beschäftigung, die zu Ihren Qualifikationen, Erfahrungen und persönlichen Voraussetzungen passt. Dabei begleite ich den gesamten schriftlichen Bewerbungsprozess bis zur Unterzeichnung eines neuen Arbeitsvertrags.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Für wen eignet sich die Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die Jobvermittlung eignet sich für Menschen, die eine neue sozialversicherungspflichtige Beschäftigung suchen und sich gezielte Unterstützung wünschen. Dazu gehören Arbeitsuchende, berufliche Wiedereinsteiger, Menschen in einer beruflichen Neuorientierung und Beschäftigte, die aus einem bestehenden Arbeitsverhältnis heraus wechseln möchten.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was ist der Unterschied zwischen Jobcoaching und Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Im Jobcoaching beantworten wir die Frage: Welcher Beruf oder welche Tätigkeit passt zu mir?<\u002Fp><p>Bei der Jobvermittlung geht es um die konkrete Umsetzung. Ich suche passende Stellen und Arbeitgeber, bereite Ihre Bewerbungen vor und begleite den schriftlichen Bewerbungsprozess bis zum neuen Arbeitsvertrag.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was ist der Unterschied zwischen Recruiting und Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Beim Recruiting steht die offene Stelle eines Unternehmens im Mittelpunkt. Gesucht wird eine Person, welche die Anforderungen dieser Stelle erfüllt.<\u002Fp><p>Bei der Jobvermittlung stehen Sie als jobsuchender Mensch im Mittelpunkt. Ich suche für Sie eine Stelle, die zu Ihren Qualifikationen, Erfahrungen und persönlichen Voraussetzungen passt.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Warum geht der Jobvermittlung ein Bewerbungscoaching voraus?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Eine erfolgreiche Jobvermittlung benötigt eine professionelle Grundlage. Bevor ich Bewerbungen versende, müssen Ihr berufliches Ziel, Ihre Qualifikationen und Ihre Bewerbungsunterlagen zusammenpassen. Unternehmen sollen auf den ersten Blick erkennen, welchen Mehrwert Sie mitbringen.<\u002Fp><p>Im Bewerbungscoaching bereiten wir deshalb Ihren gesamten Auftritt vor. Dadurch kann ich Sie anschließend gezielter vermitteln und geeignete Arbeitgeber mit überzeugenden, hochwertigen Bewerbungsunterlagen ansprechen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was beinhaltet das Bewerbungscoaching?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Das Bewerbungscoaching bereitet Sie umfassend auf Ihre Stellensuche vor. Dazu gehören:<\u002Fp><ul><li><span>professioneller und überzeugender Lebenslauf<\u002Fspan><\u002Fli><li><span>passendes und hochwertiges Anschreiben<\u002Fspan><\u002Fli><li><span>geeignete Jobtitel und Suchbegriffe<\u002Fspan><\u002Fli><li><span>professionelles Bewerbungsfoto, auf Wunsch mit KI oder einem Kooperationspartner<\u002Fspan><\u002Fli><li><span>Vorbereitung und Übung von Vorstellungsgesprächen<\u002Fspan><\u002Fli><li><span>Gehaltsanalyse und Vorbereitung auf Gehaltsverhandlungen<\u002Fspan><\u002Fli><li><span>gegebenenfalls Planung des weiteren Karrierewegs<\u002Fspan><\u002Fli><li><span>gegebenenfalls Prüfung sinnvoller Weiterbildungen<\u002Fspan><\u002Fli><li><span>Vorbereitung auf die schriftliche, telefonische und persönliche Kommunikation mit Unternehmen<\u002Fspan><\u002Fli><\u002Ful><p>Anschließend beginnt die aktive Jobvermittlung mit Arbeitsmarkt-Scan, Stellensuche, Ihrer Freigabe und dem gezielten Versand Ihrer Bewerbungen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wie beginnt die Zusammenarbeit?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Wir beginnen mit einem persönlichen Kennenlerngespräch. Dabei sprechen wir über Ihre berufliche Vergangenheit, Ihre aktuelle Situation und Ihre zukünftigen Wünsche. Anschließend klären wir, welche Tätigkeiten, Unternehmen, Arbeitsmodelle und Rahmenbedingungen zu Ihnen passen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wie läuft die Jobvermittlung ab?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Zunächst analysieren wir Ihre Qualifikationen, Erfahrungen, Stärken und beruflichen Ziele. Danach bestimmen wir passende Jobtitel, Suchbegriffe und Tätigkeitsbereiche.<\u002Fp><p>Ich durchsuche den Arbeitsmarkt nach geeigneten Stellen, bespreche die Ergebnisse mit Ihnen und bereite passende Bewerbungen vor und versende diese.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wie lange dauert die Zusammenarbeit?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die gesamte Zusammenarbeit dauert sechs Monate bzw. endet mit der Arbeitsvertragsunterschrift.<\u002Fp><ul><li><span>rund zwei Wochen intensives Bewerbungscoaching und danach nach Bedarf während des Vermittlungsverfahrens, z. B. Bewerbungsgesprächsimulation<\u002Fspan><\u002Fli><li><span>anschließend rund fünfeinhalb Monate aktive Jobvermittlung<\u002Fspan><\u002Fli><\u002Ful><p>Während des Bewerbungscoachings schaffen wir die professionelle Grundlage. Danach suche ich gezielt nach passenden Stellen und begleite Ihre Bewerbungen. Wird vorher ein Arbeitsvertrag unterschrieben, endet die aktive Stellensuche entsprechend früher.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Erfolgt die Stellensuche regional oder deutschlandweit?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die Stellensuche kann regional oder deutschlandweit erfolgen. Der Suchbereich richtet sich nach Ihren persönlichen Möglichkeiten und Wünschen. Gemeinsam legen wir fest, welche Orte, Regionen, Entfernungen und Arbeitsmodelle für Sie realistisch sind.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Berücksichtigen Sie auch alternative Jobtitel und Branchen?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Unternehmen verwenden für ähnliche Aufgaben häufig unterschiedliche Stellenbezeichnungen. Deshalb suche ich nicht nur nach einem bekannten Berufstitel, sondern auch nach passenden Alternativen, verwandten Tätigkeiten und geeigneten Suchbegriffen. Dadurch werden Stellen sichtbar, die bei einer einfachen Jobsuche leicht übersehen werden.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Unterstützen Sie mich bei den Bewerbungsunterlagen?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Im vorgeschalteten Bewerbungscoaching erstelle oder überarbeite ich gemeinsam mit Ihnen den Lebenslauf, die Anschreiben, Jobtitel und Suchbegriffe. Dadurch entsteht eine hochwertige und zielgerichtete Grundlage für die anschließende Jobvermittlung.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Versenden Sie die Bewerbungen in meinem Namen?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Ich versende Ihre Bewerbungen in Ihrem Namen – professionell, gezielt und erst nach Ihrer Freigabe. Sie entscheiden, auf welche Stellen Sie sich bewerben möchten.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Ist eine diskrete Jobvermittlung möglich?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Bei Selbstzahlern arbeite ich auf Wunsch diskret und anonym im Hintergrund. Ich übernehme die schriftliche Vorbereitung und Kommunikation sowie den Versand der Bewerbungen. Gegenüber dem Unternehmen treten Sie selbst als Bewerberin oder Bewerber auf. Besonders bei einem Wechsel aus einem bestehenden Arbeitsverhältnis bleibt unsere Zusammenarbeit dadurch vertraulich.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wer übernimmt die Kommunikation mit den Unternehmen?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die schriftliche Kommunikation kann ich nach vorheriger Abstimmung für Sie übernehmen. Sobald ein telefonisches, digitales oder persönliches Gespräch erforderlich ist, übernehmen Sie den direkten Kontakt mit dem Unternehmen.<\u002Fp><p>Damit Sie dabei sicher auftreten, bereiten wir die Gesprächsinhalte gemeinsam Schritt für Schritt vor.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Bereiten Sie mich auf Vorstellungsgespräche vor?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Vor einem telefonischen, digitalen oder persönlichen Gespräch besprechen wir mögliche Fragen, wichtige Inhalte und die Erwartungen des Unternehmens. Sie erfahren, welche Erfahrungen und Stärken Sie hervorheben können und wie Sie Ihre Motivation überzeugend darstellen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wie lange dauert eine erfolgreiche Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die Dauer hängt von Ihrer Qualifikation, Ihren beruflichen Zielen, der Region und den verfügbaren Stellen ab. Nach meiner bisherigen Erfahrung finden viele betreute Personen innerhalb von vier bis sechs Monaten eine neue sozialversicherungspflichtige Beschäftigung. Einzelne Vermittlungen können schneller oder langsamer verlaufen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was passiert, wenn nach sechs Monaten noch keine Stelle gefunden wurde?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ich kann Ihnen nicht versprechen, dass wir innerhalb von sechs Monaten eine passende Stelle finden. Der Erfolg hängt auch vom Arbeitsmarkt, Ihrer Qualifikation, der gewünschten Region und den verfügbaren Stellen ab.<\u002Fp><p>Sie gehen jedoch nicht mit derselben Unsicherheit und demselben Frust aus unserer Zusammenarbeit, mit denen unsere gemeinsame Reise beginnt. Auch wenn noch kein Arbeitsvertrag unterschrieben ist, verfügen Sie anschließend über:<\u002Fp><ul><li><span>aktuelle und hochwertige Bewerbungsunterlagen<\u002Fspan><\u002Fli><li><span>einen professionellen Lebenslauf<\u002Fspan><\u002Fli><li><span>passende Anschreiben<\u002Fspan><\u002Fli><li><span>geeignete Jobtitel und Suchbegriffe<\u002Fspan><\u002Fli><li><span>eine klare Strategie für Ihre weitere Stellensuche<\u002Fspan><\u002Fli><li><span>das Wissen, wie Sie passende Stellen im Internet finden<\u002Fspan><\u002Fli><li><span>mehr Sicherheit in Vorstellungsgesprächen<\u002Fspan><\u002Fli><li><span>eine realistische Einschätzung Ihres Gehaltspotenzials<\u002Fspan><\u002Fli><li><span>Klarheit über sinnvolle Weiterbildungen und Ihren weiteren Karriereweg<\u002Fspan><\u002Fli><\u002Ful><p>Im Laufe unserer Zusammenarbeit zeigt sich außerdem, welche zusätzlichen Qualifikationen oder Weiterbildungen möglicherweise notwendig sind, damit Sie Ihr berufliches Ziel erreichen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Unterstützen Sie mich bei einer notwendigen Weiterbildung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Ja. Wenn sich während der Zusammenarbeit herausstellt, dass eine bestimmte Weiterbildung Ihre beruflichen Chancen deutlich verbessert, erhalten Sie von mir eine fachlich begründete Empfehlung für die Agentur für Arbeit oder das Jobcenter.<\u002Fp><p>Darin erläutere ich, welche Weiterbildung sinnvoll ist, warum sie für Ihr Berufsziel benötigt wird und wie sie Ihre Chancen auf eine sozialversicherungspflichtige Beschäftigung verbessert. Über eine Kostenübernahme entscheidet anschließend die zuständige Agentur für Arbeit oder das Jobcenter.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was ist ein AVGS-MPAV?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Der AVGS-MPAV ist ein Aktivierungs- und Vermittlungsgutschein für eine private Arbeitsvermittlung. Er wird von der Agentur für Arbeit oder dem Jobcenter ausgestellt. Mit einem bewilligten und passenden AVGS-MPAV können Sie die zugelassene private Jobvermittlung vollständig kostenfrei nutzen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Was kostet die Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Mit einem bewilligten AVGS-MPAV ist die Jobvermittlung für Sie vollständig kostenfrei. Die Agentur für Arbeit oder das Jobcenter übernimmt die gesamten Vermittlungskosten.<\u002Fp><p>Als Selbstzahler investieren Sie insgesamt 2.500 Euro. Die Zahlung erfolgt fair in drei Schritten:<\u002Fp><ol><li><span>834 Euro zu Beginn des intensiven Bewerbungscoachings<\u002Fspan><\u002Fli><li><span>834 Euro bei Unterzeichnung Ihres neuen Arbeitsvertrags<\u002Fspan><\u002Fli><li><span>832 Euro nach drei Monaten in Ihrem neuen Job<\u002Fspan><\u002Fli><\u002Fol><p>Sie zahlen nicht alles auf einmal. Der größte Teil wird erst fällig, wenn Sie Ihren neuen Arbeitsvertrag unterschrieben haben und erfolgreich im neuen Job angekommen sind.<\u002Fp><p class=\"faq-note\">Stand: Juli 2026. Aktuelle Preise bitte erfragen.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Wann endet die aktive Jobvermittlung und das Bewerbungscoaching?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Die aktive Jobvermittlung endet, sobald Sie einen neuen Arbeitsvertrag unterschrieben haben oder der vereinbarte Vermittlungszeitraum von sechs Monaten abgelaufen ist. Bis dahin begleite ich Ihre Stellensuche, Ihre schriftlichen Bewerbungen und die Vorbereitung auf den Kontakt mit möglichen Arbeitgebern.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"faq-item\" open=\"\">\n        <summary><span class=\"faq-q\">Welche Erfahrung hat Anita Bösche in der Jobvermittlung?<\u002Fspan><svg class=\"faq-chev\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n        <div class=\"faq-body\"><p>Anita Bösche verfügt über rund acht Jahre Erfahrung in der Jobvermittlung. Nach eigener Schätzung hat sie etwa 830 Menschen erfolgreich in eine Festanstellung, eine Beschäftigung in der Zeitarbeit oder eine freiberufliche Tätigkeit vermittelt.<\u002Fp><p>Ihre Erfolgsquote bei der Vermittlung in sozialversicherungspflichtige Festanstellungen und Zeitarbeit liegt nach eigener Auswertung bei rund 96 Prozent. Freiberufliche Vermittlungen sind in dieser Erfolgsquote nicht enthalten.<\u002Fp><\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"epa-cta2\" aria-label=\"Kostenloses Kennenlerngespräch\">\n    <div class=\"epa-cta2-left\">\n      <span class=\"epa-cta2-logo\"><svg width=\"60%\" height=\"60%\" viewBox=\"0 0 24 24\" fill=\"#3a2408\" aria-hidden=\"true\"><path d=\"M12 2.6l1.5 2.7 3-.4-1 2.9 2.4 1.9-2.8 1.1.2 3-2.6-1.5-2.6 1.5.2-3-2.8-1.1 2.4-1.9-1-2.9 3 .4z\" opacity=\".9\"><\u002Fpath><path d=\"M12 12.4c-2.6 0-4.9 1.3-6.3 3.3-.4.6.1 1.3.8 1.3h11c.7 0 1.2-.7.8-1.3-1.4-2-3.7-3.3-6.3-3.3z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div>\n        <div class=\"epa-cta2-title\">Kostenloses Kennenlerngespräch<\u002Fdiv>\n        <div class=\"epa-cta2-sub\">Kontaktieren Sie mich noch heute<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"epa-cta2-divider\" aria-hidden=\"true\"><\u002Fdiv>\n    <nav class=\"epa-cta2-actions\" aria-label=\"Kontaktmöglichkeiten\">\n      <a href=\"tel:+4916091880672\"><span class=\"epa-cta2-ic\"><svg viewBox=\"0 0 24 24\" width=\"52%\" height=\"52%\" fill=\"none\" stroke=\"#ecc568\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>Telefon<\u002Fa>\n      <span class=\"epa-cta2-dot\" aria-hidden=\"true\"><\u002Fspan>\n      <a href=\"https://koalendar.com/e/jobcoaching-kennenlerngesprach-15-minuten-kostenfrei?month=2026-06&amp;duration=15&amp;date=2026-06-29\" target=\"_blank\" rel=\"noopener\"><span class=\"epa-cta2-ic\"><svg viewBox=\"0 0 24 24\" width=\"52%\" height=\"52%\" fill=\"none\" stroke=\"#ecc568\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M16 2.5v4M8 2.5v4M3 9.5h18\"><\u002Fpath><path d=\"M8 14h3M8 17.5h6\"><\u002Fpath><\u002Fsvg><\u002Fspan>Termin sichern<\u002Fa>\n      <span class=\"epa-cta2-dot\" aria-hidden=\"true\"><\u002Fspan>\n      <a href=\"https://wa.me/4916091880672\" target=\"_blank\" rel=\"noopener\"><span class=\"epa-cta2-ic\"><svg viewBox=\"0 0 24 24\" width=\"52%\" height=\"52%\" fill=\"none\" stroke=\"#ecc568\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.5 11.5a8.4 8.4 0 0 1-12.3 7.4L3.5 20.5l1.7-4.6A8.4 8.4 0 1 1 20.5 11.5z\"><\u002Fpath><path d=\"M8.6 8.4c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.1s.9 2.4 1 2.6c.2.2 1.8 2.8 4.4 3.8 2.2.8 2.6.7 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3l-1.6-.8c-.2-.1-.4-.1-.6.1l-.6.8c-.1.2-.3.2-.5.1-.3-.1-1.1-.4-2-1.3-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3.2-.5 0-.2 0-.3 0-.5l-.7-1.6c-.2-.4-.4-.4-.6-.4h-.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>WhatsApp<\u002Fa>\n      <span class=\"epa-cta2-dot\" aria-hidden=\"true\"><\u002Fspan>\n      <a href=\"mailto:kontakt@externe-personalabteilung.de\"><span class=\"epa-cta2-ic\"><svg viewBox=\"0 0 24 24\" width=\"52%\" height=\"52%\" fill=\"none\" stroke=\"#ecc568\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"5\" width=\"19\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 6.5l9 6 9-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>E-Mail<\u002Fa>\n    <\u002Fnav>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fmain>\n\n<\u002Fbody><\u002Fhtml>"
