  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

umns:1fr !important; }\n    .pad { padding-left:22px !important; padding-right:22px !important; }\n    .brandstrip { margin-left:22px !important; margin-right:22px !important; }\n    .hdr { flex-wrap:wrap; justify-content:center; text-align:center; }\n    .hdr-title { flex-basis:100%; order:2; }\n  }\n  @media (max-width: 520px) {\n    .grid6 { grid-template-columns:1fr !important; }\n    .chk { grid-template-columns:1fr !important; }\n    .flow { flex-wrap:wrap; justify-content:center; gap:14px !important; }\n    .flow .arrow { display:none !important; }\n    .pad { padding-left:16px !important; padding-right:16px !important; }\n    .brandstrip { margin-left:16px !important; margin-right:16px !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:100%; max-width:1040px; margin:0 auto; background:#ffffff; color:#3a2412; font-family:'Mulish',sans-serif; box-shadow:0 12px 48px rgba(74,44,20,.18); overflow:hidden;\">\n\n  <!-- ============ HEADER ============ -->\n  <div class=\"pad hdr\" style=\"padding:34px 40px 26px; display:flex; align-items:flex-start; gap:20px; position:relative;\">\n    <div style=\"flex-shrink:0; width:66px; height:78px; border:4px solid #4a2c14; border-radius:9px; position:relative; margin-top:6px;\">\n      <div style=\"position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:26px; height:12px; border:4px solid #4a2c14; border-radius:4px; background:#fff;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:16px; left:11px; width:14px; height:14px; border-radius:50%; background:#4a2c14;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:19px; left:30px; right:9px; height:4px; background:#d9822b; border-radius:2px;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:28px; left:30px; right:14px; height:4px; background:#c8a680; border-radius:2px;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:42px; left:11px; right:9px; height:3px; background:#c8a680; border-radius:2px;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:51px; left:11px; right:9px; height:3px; background:#c8a680; border-radius:2px;\"><\u002Fdiv>\n      <div style=\"position:absolute; top:60px; left:11px; right:22px; height:3px; background:#c8a680; border-radius:2px;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hdr-title\" style=\"flex:1; text-align:center; padding-top:2px; min-width:220px;\">\n      <h1 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:clamp(30px,6vw,58px); line-height:.98; color:#4a2c14; letter-spacing:-.5px;\">AVGS für Jobvermittlung / AVGS-MPAV<\u002Fh1>\n      <p style=\"margin:10px 0 0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:clamp(14px,2.3vw,22px); letter-spacing:.5px; color:#c4691a; text-transform:uppercase;\">Ihr Weg zur passenden Arbeitsstelle – kostenfrei, effizient, erfolgreich<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex-shrink:0; width:118px; height:118px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e79a3f, #c4691a); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff; box-shadow:0 6px 16px rgba(196,105,26,.4);\">\n      <div style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:22px; line-height:1;\">AVGS-MPAV<\u002Fdiv>\n      <div style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:600; font-size:11px; line-height:1.15; margin-top:5px; padding:0 12px; text-transform:uppercase; letter-spacing:.3px;\">Ihre Chance auf eine neue Zukunft ★<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- brand strip -->\n  <div class=\"brandstrip\" style=\"margin:0 40px 8px; display:flex; align-items:center; justify-content:center; gap:12px; padding:9px 0; border-top:1px solid #ead6b8; border-bottom:1px solid #ead6b8; flex-wrap:wrap; text-align:center;\">\n    <div style=\"width:26px; height:26px; border-radius:6px; background:#4a2c14; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:16px; flex-shrink:0;\">E<\u002Fdiv>\n    <div style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:clamp(15px,2.2vw,19px); color:#4a2c14; letter-spacing:.2px;\">Externe-Personalabteilung.de <span style=\"color:#c4691a; font-weight:600;\">· Anita Bösche · Private Arbeitsvermittlung mit AVGS-MPAV<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ ROW 1: SECTIONS 1 & 2 ============ -->\n  <div class=\"pad grid2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px; padding:18px 40px 4px;\">\n\n    <!-- Section 1 -->\n    <div>\n      <div style=\"display:flex; align-items:center; gap:12px; background:#4a2c14; border-radius:8px; padding:9px 16px; margin-bottom:16px;\">\n        <div style=\"width:30px; height:30px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; flex-shrink:0;\">1<\u002Fdiv>\n        <h2 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:22px; color:#fff; text-transform:uppercase; letter-spacing:.4px;\">Was ist AVGS?<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 14px; font-size:15px; line-height:1.5;\"><strong>AVGS bedeutet Aktivierungs- und Vermittlungsgutschein.<\u002Fstrong><\u002Fp>\n      <div style=\"display:flex; gap:16px; margin-bottom:16px; align-items:flex-start; flex-wrap:wrap;\">\n        <div style=\"width:118px; height:74px; flex-shrink:0; background:linear-gradient(135deg,#d9822b,#c4691a); border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; color:#fff; box-shadow:0 4px 10px rgba(196,105,26,.3);\">\n          <span style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:26px;\">AVGS<\u002Fspan>\n          <span style=\"font-size:22px;\">★<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px; line-height:1.5; flex:1; min-width:180px;\"><strong style=\"color:#c4691a;\">Bildlich erklärt:<\u002Fstrong><br>Der AVGS ist wie ein Gutschein oder Türöffner, den Sie von der Agentur für Arbeit oder vom Jobcenter bekommen können, damit Sie auf Ihrem Weg zurück in den Beruf Unterstützung erhalten.<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 14px; font-size:14px; line-height:1.5;\">Mit einem AVGS können – je nach Art des Gutscheins – folgende Leistungen finanziert werden:<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; margin-bottom:16px;\">\n        <div><div style=\"font-size:30px; line-height:1; color:#7a4e26;\">👥<\u002Fdiv><div style=\"font-size:12.5px; font-weight:600; margin-top:6px;\">Jobcoaching<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:30px; line-height:1; color:#7a4e26;\">📝<\u002Fdiv><div style=\"font-size:12.5px; font-weight:600; margin-top:6px;\">Bewerbungs­coaching<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:30px; line-height:1; color:#7a4e26;\">🤝<\u002Fdiv><div style=\"font-size:12.5px; font-weight:600; margin-top:6px;\">Jobvermittlung / private Arbeits­vermittlung<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;\">\n        <div style=\"color:#2f8f4e; font-size:18px; flex-shrink:0;\">✔<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5;\"><strong>Das bedeutet für Sie:<\u002Fstrong> Wenn der AVGS bewilligt wurde und der Anbieter zugelassen ist, werden die Kosten vollständig von der Agentur für Arbeit oder vom Jobcenter übernommen.<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 14px; font-size:14px; line-height:1.5;\"><strong>Kurz gesagt:<\u002Fstrong> Sie bekommen professionelle Unterstützung – und müssen die Kosten nicht selbst tragen.<\u002Fp>\n      <div style=\"display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.45;\">\n        <div style=\"color:#7a4e26; font-size:16px;\">🌐<\u002Fdiv>\n        <div style=\"min-width:0; word-break:break-word;\"><strong>Offizielle Seite der Agentur für Arbeit:<\u002Fstrong><br><a href=\"https://www.arbeitsagentur.de/arbeitslos-arbeit-finden/aktivierungs-vermittlungsschein-avgs\">www.arbeitsagentur.de/arbeitslos-arbeit-finden/aktivierungs-vermittlungsschein-avgs<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Section 2 -->\n    <div>\n      <div style=\"display:flex; align-items:center; gap:12px; background:#4a2c14; border-radius:8px; padding:9px 16px; margin-bottom:16px;\">\n        <div style=\"width:30px; height:30px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; flex-shrink:0;\">2<\u002Fdiv>\n        <h2 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:22px; color:#fff; text-transform:uppercase; letter-spacing:.4px;\">Wer bekommt den AVGS?<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 12px; font-size:14px; line-height:1.5;\">Ein AVGS kann grundsätzlich für Personen infrage kommen, die bei der Agentur für Arbeit oder beim Jobcenter gemeldet sind und Unterstützung auf dem Weg in Arbeit benötigen.<\u002Fp>\n      <p style=\"margin:0 0 12px; font-size:14px; line-height:1.5;\">Beim <strong>AVGS-MPAV<\u002Fstrong> geht es um die direkte private Arbeitsvermittlung in eine sozialversicherungspflichtige Beschäftigung. Dafür sollten Personen dem Arbeitsmarkt zur Verfügung stehen und eine sozialversicherungspflichtige Arbeitsstelle suchen.<\u002Fp>\n      <p style=\"margin:0 0 10px; font-size:14px; line-height:1.5;\"><strong>Dazu gehören zum Beispiel:<\u002Fstrong><\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:11px; margin-bottom:14px;\">\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">🧑‍💼<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Arbeitslose mit Arbeitslosengeld I<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">👨‍👩‍👦<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Bürgergeld-Empfängerinnen und Bürgergeld-Empfänger<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">🔎<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Arbeitsuchende Personen, die noch nicht arbeitslos sind, aber Unterstützung bei der beruflichen Neuorientierung, beim Wiedereinstieg oder bei der Bewerbung benötigen<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">🎓<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Schulabgängerinnen und Schulabgänger, wenn sie bei der Agentur für Arbeit oder beim Jobcenter gemeldet sind<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">📖<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Studienabbrecherinnen und Studienabbrecher, wenn sie bei der Agentur für Arbeit oder beim Jobcenter gemeldet sind<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:flex-start;\"><div style=\"font-size:20px; color:#7a4e26; width:24px; text-align:center; flex-shrink:0;\">🌍<\u002Fdiv><div style=\"font-size:13.5px; line-height:1.45;\">Neu zugewanderte oder internationale Arbeitsuchende, wenn sie arbeiten dürfen und bei der Agentur für Arbeit oder beim Jobcenter gemeldet sind<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fbe9d3; border:1px solid #eec9a0; border-radius:8px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;\">\n        <div style=\"width:24px; height:24px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0;\">!<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.5;\"><strong>Wichtig:<\u002Fstrong> Die endgültige Entscheidung über die Bewilligung trifft immer die zuständige Vermittlungsfachkraft der Agentur für Arbeit oder des Jobcenters.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ SECTION 3 ============ -->\n  <div class=\"pad\" style=\"padding:22px 40px 4px;\">\n    <div style=\"display:flex; align-items:center; gap:12px; background:#4a2c14; border-radius:8px; padding:9px 16px; margin-bottom:14px;\">\n      <div style=\"width:30px; height:30px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; flex-shrink:0;\">3<\u002Fdiv>\n      <h2 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:clamp(16px,2.8vw,22px); color:#fff; text-transform:uppercase; letter-spacing:.4px;\">Wie beantrage ich den AVGS für Jobvermittlung / AVGS-MPAV?<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 4px; font-size:14px; line-height:1.5;\">Wenn Sie Unterstützung bei der Jobvermittlung durch eine private Arbeitsvermittlung möchten, beantragen Sie den AVGS-MPAV bei der Agentur für Arbeit oder beim Jobcenter.<\u002Fp>\n    <p style=\"margin:0 0 16px; font-size:14px; line-height:1.5; font-weight:700; color:#4a2c14;\">AVGS-MPAV bedeutet: <span style=\"color:#c4691a;\">Aktivierungs- und Vermittlungsgutschein<\u002Fspan> für private Arbeitsvermittlung<\u002Fp>\n\n    <div class=\"grid-apply\" style=\"display:grid; grid-template-columns:1fr 1fr 2.1fr 1fr; gap:18px; align-items:stretch;\">\n      <!-- step 1 -->\n      <div>\n        <div style=\"display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;\">1<\u002Fdiv><div style=\"font-weight:700; font-size:14px; color:#4a2c14; line-height:1.2;\">AVGS-MPAV online beantragen<\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0 0 10px; font-size:12px; line-height:1.5;\"><strong>Öffnen Sie die Seite der Agentur für Arbeit:<\u002Fstrong><\u002Fp>\n        <div style=\"display:flex; gap:8px; align-items:flex-start; font-size:11.5px; line-height:1.4; margin-bottom:10px;\"><div style=\"color:#7a4e26;\">🌐<\u002Fdiv><div style=\"min-width:0; word-break:break-word;\"><a href=\"https://www.arbeitsagentur.de/arbeitslos-arbeit-finden/aktivierungs-vermittlungsschein-avgs-private-arbeitsvermittlung\">arbeitsagentur.de/…/aktivierungs-vermittlungsschein-avgs-private-arbeitsvermittlung<\u002Fa><\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0 0 10px; font-size:12px; line-height:1.5;\">Melden Sie sich in Ihrem Online-Account der Agentur an und klicken Sie auf den Button zum Beantragen des AVGS-MPAV.<\u002Fp>\n        <a href=\"https://www.arbeitsagentur.de/arbeitslos-arbeit-finden/aktivierungs-vermittlungsschein-avgs-private-arbeitsvermittlung\" style=\"display:block; text-align:center; text-decoration:none; background:#c0392b; color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:.3px; padding:9px 12px; border-radius:8px; margin-bottom:12px; box-shadow:0 3px 8px rgba(192,57,43,.3);\">AVGS-MPAV beantragen<\u002Fa>\n        <p style=\"margin:0 0 12px; font-size:12px; line-height:1.5;\">Alternativ können Sie Ihre Vermittlungsfachkraft auch anschreiben oder telefonisch kontaktieren.<\u002Fp>\n        <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:10px 12px; margin-bottom:12px; display:flex; gap:8px; align-items:center;\">\n          <div style=\"font-size:16px; color:#7a4e26;\">📞<\u002Fdiv>\n          <div><div style=\"font-size:12px; font-weight:700; color:#4a2c14;\">Hotline Agentur für Arbeit:<\u002Fdiv><div style=\"font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; color:#c4691a;\">0800 4 555500<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12px; line-height:1.5;\"><strong>Jobcenter-Telefonnummer ermitteln:<\u002Fstrong> Dienststellensuche öffnen, Ihren Ort eingeben, dann erscheint die Telefonnummer.<\u002Fp>\n      <\u002Fdiv>\n      <!-- step 2 -->\n      <div>\n        <div style=\"display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;\">2<\u002Fdiv><div style=\"font-weight:700; font-size:14px; color:#4a2c14; line-height:1.2;\">AVGS für Jobvermittlung beantragen<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:56px; height:66px; border:3px solid #7a4e26; border-radius:6px; margin:6px 0 12px; display:flex; flex-direction:column; justify-content:center; gap:6px; padding:0 8px;\">\n          <div style=\"height:4px; background:#2f8f4e; border-radius:2px;\"><\u002Fdiv>\n          <div style=\"height:4px; background:#2f8f4e; border-radius:2px;\"><\u002Fdiv>\n          <div style=\"height:4px; background:#2f8f4e; border-radius:2px; width:70%;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55;\">Bitten Sie um einen <strong>Aktivierungs- und Vermittlungsgutschein<\u002Fstrong> für private Arbeitsvermittlung / Jobvermittlung.<\u002Fp>\n      <\u002Fdiv>\n      <!-- step 3: letter -->\n      <div id=\"brief-card\" style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:14px 16px;\">\n        <div style=\"display:flex; gap:8px; align-items:center; margin-bottom:10px;\"><div style=\"font-size:18px; color:#7a4e26;\">✉️<\u002Fdiv><div style=\"font-weight:700; font-size:14px; color:#4a2c14;\">Brief oder Begründung am Telefon<\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\"><em>Sehr geehrte*r [Name Ihres Betreuers / Ihrer Betreuerin],<\u002Fem><\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">ich bin arbeitssuchend / arbeitslos gemeldet und möchte unbedingt wieder in den Arbeitsmarkt zurückkehren. Mir ist wichtig, nicht stehen zu bleiben, sondern aktiv an meiner beruflichen Zukunft zu arbeiten. Ich möchte wieder langfristig beschäftigt sein und meinen Lebensunterhalt selbst sichern.<\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Aktuell merke ich jedoch, dass ich bei der Stellensuche und beim Kontakt zu passenden Arbeitgebern dringend professionelle Unterstützung brauche. Deshalb bitte ich um Prüfung und Bewilligung eines Aktivierungs- und Vermittlungsgutscheins für private Arbeitsvermittlung / Jobvermittlung, AVGS-MPAV.<\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Ich wünsche mir Unterstützung durch eine private Jobvermittlung, weil: <em>(wählen Sie passende Punkte aus und löschen Sie die anderen im Brief)<\u002Fem><\u002Fp>\n        <div class=\"chk\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:3px 14px; margin:6px 0 12px;\">\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich schneller passende Arbeitgeber finden möchte.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich beruflich wieder Fuß fassen möchte.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich Unterstützung bei der gezielten Stellensuche brauche.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich eine langfristige und passende Beschäftigung aufnehmen möchte.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich Zugang zu passenden offenen Stellen erhalten möchte.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich meine Chancen auf eine Arbeitsaufnahme deutlich erhöhen möchte.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich bisher alleine keine passende Arbeitsstelle gefunden habe.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich Unterstützung brauche, um passende Stellen in meinem Umfeld zu finden.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich viele Bewerbungen geschrieben habe, aber kaum Rückmeldungen erhalten habe.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich aktuell alleine nicht gut weiterkomme und professionelle Vermittlungsunterstützung brauche.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich Unterstützung bei der Ansprache von Arbeitgebern brauche.<\u002Flabel>\n          <label style=\"font-size:11px; line-height:1.4; display:flex; gap:5px;\"><input type=\"checkbox\" style=\"margin-top:2px; accent-color:#c4691a;\">ich motiviert bin zu arbeiten, aber Hilfe beim Zugang zu passenden Arbeitgebern benötige.<\u002Flabel>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Die private Jobvermittlung soll mir helfen, passende Stellen zu finden, Kontakte zu Arbeitgebern herzustellen und mich wieder zurück in Arbeit aktiv zu unterstützen.<\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Das Angebot von <strong>Anita Bösche / Externe-Personalabteilung.de<\u002Fstrong> passt sehr gut zu meiner aktuellen Situation und meinem Ziel, wieder in Arbeit zu kommen.<br>Anbieterin: Anita Bösche / Externe-Personalabteilung.de<br>Arbeitsagentur-Kundennummer der Anbieterin: <strong>A863B17231<\u002Fstrong><\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Ein AVGS-MPAV ist aus meiner Sicht gut investiert und ohne finanzielles Risiko, da eine Zahlung nur dann erfolgt, wenn tatsächlich eine erfolgreiche Vermittlung zustande kommt und ein Arbeitsvertrag abgeschlossen wird.<\u002Fp>\n        <p style=\"margin:0 0 8px; font-size:11.5px; line-height:1.5;\">Mein Ziel ist klar: Ich möchte wieder arbeiten und brauche dafür jetzt gezielte Unterstützung bei der Vermittlung in eine passende Beschäftigung.<\u002Fp>\n        <p style=\"margin:0 0 12px; font-size:11.5px; line-height:1.5;\">Ich bitte Sie daher um Prüfung, ob für mich ein AVGS-MPAV für private Arbeitsvermittlung / Jobvermittlung bewilligt werden kann.<br>Meine eigene Kd.-Nr. bei der Agentur für Arbeit lautet: <em>[Ihre Kundennummer eintragen]<\u002Fem>.<br>Vielen Dank.<br>Mit freundlichen Grüßen<br><em>[Ihr Vorname Nachname]<\u002Fem><\u002Fp>\n        <button sc-camel-on-click=\"{{ copyBrief }}\" style=\"width:100%; border:none; cursor:pointer; background:#c4691a; color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.3px; padding:11px 14px; border-radius:8px; box-shadow:0 3px 8px rgba(196,105,26,.35); display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s;\" style-hover=\"background:#a5520f;\">📋 Brief kopieren<\u002Fbutton>\n        <p style=\"margin:7px 0 0; font-size:10.5px; line-height:1.4; color:#7a5a3a; text-align:center;\">Angekreuzte Punkte werden übernommen – oder alle, wenn nichts ausgewählt ist.<\u002Fp>\n      <\u002Fdiv>\n      <!-- step 4 -->\n      <div>\n        <div style=\"display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;\"><div style=\"width:22px; height:22px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;\">4<\u002Fdiv><div style=\"font-weight:700; font-size:14px; color:#4a2c14; line-height:1.2;\">Bewilligung abwarten<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:40px; text-align:center; margin:6px 0 12px; color:#7a4e26;\">⏳<\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.55;\">Erst wenn der Gutschein bewilligt wurde, kann die Jobvermittlung starten.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ SECTION 4 ============ -->\n  <div class=\"pad\" style=\"padding:22px 40px 4px;\">\n    <div style=\"display:flex; align-items:center; gap:12px; background:#4a2c14; border-radius:8px; padding:9px 16px; margin-bottom:14px;\">\n      <div style=\"width:30px; height:30px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; flex-shrink:0;\">4<\u002Fdiv>\n      <h2 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:clamp(17px,3vw,22px); color:#fff; text-transform:uppercase; letter-spacing:.4px;\">Ich habe den AVGS – was muss ich jetzt tun?<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"grid2\" style=\"display:grid; grid-template-columns:1.15fr 1fr; gap:26px;\">\n      <div>\n        <p style=\"margin:0 0 14px; font-size:13.5px; line-height:1.5;\">Sie haben Ihren AVGS von der Agentur für Arbeit oder vom Jobcenter erhalten? Dann senden Sie mir den Gutschein einfach zu. Ich prüfe alles Weitere und bereite die nächsten Schritte für Ihre Jobvermittlung vor.<\u002Fp>\n        <p style=\"margin:0 0 10px; font-size:13px; font-weight:700; color:#c4691a;\">Bildlich gesagt:<\u002Fp>\n        <div class=\"flow\" style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:16px;\">\n          <div style=\"text-align:center; width:74px;\"><div style=\"width:44px; height:30px; margin:0 auto; background:linear-gradient(135deg,#d9822b,#c4691a); border-radius:4px; color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;\">AVGS<\u002Fdiv><div style=\"font-size:10.5px; margin-top:5px; line-height:1.3;\">AVGS erhalten<\u002Fdiv><\u002Fdiv>\n          <div class=\"arrow\" style=\"color:#d9822b; font-size:20px; padding-top:8px;\">➜<\u002Fdiv>\n          <div style=\"text-align:center; width:74px;\"><div style=\"font-size:26px;\">📷<\u002Fdiv><div style=\"font-size:10.5px; margin-top:5px; line-height:1.3;\">Foto machen<\u002Fdiv><\u002Fdiv>\n          <div class=\"arrow\" style=\"color:#d9822b; font-size:20px; padding-top:8px;\">➜<\u002Fdiv>\n          <div style=\"text-align:center; width:74px;\"><div style=\"font-size:26px;\">✉️<\u002Fdiv><div style=\"font-size:10.5px; margin-top:5px; line-height:1.3;\">Zusammen mit Adresse &amp; Telefon an mich senden<\u002Fdiv><\u002Fdiv>\n          <div class=\"arrow\" style=\"color:#d9822b; font-size:20px; padding-top:8px;\">➜<\u002Fdiv>\n          <div style=\"text-align:center; width:74px;\"><div style=\"font-size:26px;\">📞<\u002Fdiv><div style=\"font-size:10.5px; margin-top:5px; line-height:1.3;\">Ich melde mich umgehend per Telefon oder E-Mail bei Ihnen<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:11px 13px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"color:#2f8f4e; font-size:16px;\">✔<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.5;\"><strong>Kurz gesagt:<\u002Fstrong> AVGS ist nicht an mich gebunden. Wenn ein anderes Angebot besser zu Ihnen passt, sage ich es Ihnen offen und gebe Ihnen Tipps, welcher Weg für Sie sinnvoller sein könnte.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 12px; text-align:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:16px; color:#4a2c14;\">Sie können den AVGS senden per:<\u002Fp>\n        <div class=\"send2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;\">\n          <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:11px 12px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"font-size:18px;\">💬<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.4;\"><strong>Messenger:<\u002Fstrong> WhatsApp, Signal oder ein anderer Messenger<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:11px 12px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"font-size:18px;\">📞<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.4;\"><strong>Telefon / Messenger:<\u002Fstrong><br>+49 160 91880672<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:11px 12px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"font-size:18px;\">✉️<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.4; min-width:0; word-break:break-word;\"><strong>E-Mail:<\u002Fstrong><br>kontakt@externe-personalabteilung.de<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#faf1e1; border:1px solid #ead6b8; border-radius:8px; padding:11px 12px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"font-size:18px;\">🌐<\u002Fdiv><div style=\"font-size:11.5px; line-height:1.4;\">Oder über den Button rechts unten auf meiner Internetseite<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fbe9d3; border:1px solid #eec9a0; border-radius:8px; padding:11px 13px; display:flex; gap:9px; align-items:flex-start;\"><div style=\"font-size:16px;\">🔒<\u002Fdiv><div style=\"font-size:11px; line-height:1.5;\"><strong>Datenschutzhinweis:<\u002Fstrong> WhatsApp ist schnell und praktisch. Die Nutzung erfolgt jedoch auf Ihre eigene Entscheidung. Wenn Sie einen datenschutzsensibleren Weg bevorzugen, senden Sie den AVGS bitte per E-Mail oder über einen anderen Messenger Ihrer Wahl, zum Beispiel Signal.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px; background:#4a2c14; border-radius:8px; padding:11px 16px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;\">\n      <span style=\"color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.4px;\">verstehen<\u002Fspan><span style=\"color:#d9822b;\">➜<\u002Fspan>\n      <span style=\"color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.4px;\">sortieren<\u002Fspan><span style=\"color:#d9822b;\">➜<\u002Fspan>\n      <span style=\"color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.4px;\">planen<\u002Fspan><span style=\"color:#d9822b;\">➜<\u002Fspan>\n      <span style=\"color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.4px;\">umsetzen<\u002Fspan><span style=\"color:#d9822b;\">➜<\u002Fspan>\n      <span style=\"color:#fff; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.4px;\">verbessern<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ SECTION 5 ============ -->\n  <div class=\"pad\" style=\"padding:22px 40px 8px;\">\n    <div style=\"display:flex; align-items:center; gap:12px; background:#4a2c14; border-radius:8px; padding:9px 16px; margin-bottom:16px;\">\n      <div style=\"width:30px; height:30px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; font-size:20px; flex-shrink:0;\">5<\u002Fdiv>\n      <h2 style=\"margin:0; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:clamp(14px,2.4vw,20px); color:#fff; text-transform:uppercase; letter-spacing:.3px;\">Ablauf bei Jobvermittlung / AVGS-MPAV – Schritt für Schritt zu Ihrer neuen Arbeitsstelle<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"grid6\" style=\"display:grid; grid-template-columns:repeat(6,1fr); gap:14px;\">\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">1<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">AVGS an mich senden<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">Nach Erhalt Ihres AVGS senden Sie mir den Gutschein einfach als Foto, Scan oder PDF zu. Danach melde ich mich bei Ihnen für ein erstes telefonisches Gespräch.<\u002Fp><\u002Fdiv>\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">2<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">Erstgespräch per Telefon<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">Wir schauen gemeinsam: Kann ich Ihnen mit meinem Angebot wirklich helfen? Passt Ihr Ziel zu meinem Angebot? Welche Unterstützung bringt Sie jetzt am schnellsten weiter?<\u002Fp><\u002Fdiv>\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">3<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">Ihre Jobvermittlung wird individuell geplant<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">Wir wählen gemeinsam passende Schritte und Vorgehensweisen aus. Die Vermittlung wird individuell auf Sie abgestimmt – keine Lösung „von der Stange“.<\u002Fp><\u002Fdiv>\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">4<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">Ziel in der Jobvermittlung<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">Unser Ziel ist es, Sie in eine passende, sozialversicherungspflichtige Beschäftigung zu vermitteln. Wir unterstützen Sie dabei, passende Stellen zu finden und Kontakte zu passenden Arbeitgebern herzustellen.<\u002Fp><\u002Fdiv>\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">5<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">Umfang und Termine<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">24 bis 40 UE möglich. 1 UE = 45 Minuten. Online via Zoom. In der Regel wöchentlich 2 bis 4 UE.<\u002Fp><\u002Fdiv>\n      <div><div style=\"display:flex; gap:7px; align-items:flex-start; margin-bottom:7px;\"><div style=\"width:20px; height:20px; border-radius:50%; background:#d9822b; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;\">6<\u002Fdiv><div style=\"font-weight:700; font-size:12.5px; color:#4a2c14; line-height:1.2;\">Abschluss mit Teilnahmezertifikat<\u002Fdiv><\u002Fdiv><p style=\"margin:0; font-size:11px; line-height:1.5;\">Nach Abschluss des Vermittlungsprozesses erhalten Sie ein Teilnahmezertifikat.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px; background:#fbe9d3; border:1px solid #eec9a0; border-radius:8px; padding:12px 16px; display:flex; gap:10px; align-items:center;\"><div style=\"color:#c4691a; font-size:18px;\">✔<\u002Fdiv><div style=\"font-size:13px; font-weight:700; color:#4a2c14; line-height:1.4;\">Kurz gesagt: AVGS erhalten → an mich senden → Erstgespräch führen → gemeinsam prüfen, ob es passt → Schritte starten → Ziel erreichen → Teilnahmezertifikat erhalten.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height:22px;\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      copyBrief: (e) => {\n        const btn = e.currentTarget;\n        const card = document.getElementById('brief-card');\n        let reasons = [];\n        if (card) {\n          const boxes = [...card.querySelectorAll('input[type=checkbox]')];\n          const checked = boxes.filter(b => b.checked);\n          const use = checked.length ? checked : boxes;\n          reasons = use.map(b => b.closest('label').textContent.trim());\n        }\n        const lines = [\n          'Sehr geehrte*r [Name Ihres Betreuers / Ihrer Betreuerin],',\n          '',\n          'ich bin arbeitssuchend / arbeitslos gemeldet und möchte unbedingt wieder in den Arbeitsmarkt zurückkehren. Mir ist wichtig, nicht stehen zu bleiben, sondern aktiv an meiner beruflichen Zukunft zu arbeiten. Ich möchte wieder langfristig beschäftigt sein und meinen Lebensunterhalt selbst sichern.',\n          '',\n          'Aktuell merke ich jedoch, dass ich bei der Stellensuche und beim Kontakt zu passenden Arbeitgebern dringend professionelle Unterstützung brauche. Deshalb bitte ich um Prüfung und Bewilligung eines Aktivierungs- und Vermittlungsgutscheins für private Arbeitsvermittlung / Jobvermittlung, AVGS-MPAV.',\n          '',\n          'Ich wünsche mir Unterstützung durch eine private Jobvermittlung, weil:'\n        ];\n        reasons.forEach(r => lines.push('- ' + r));\n        lines.push(\n          '',\n          'Die private Jobvermittlung soll mir helfen, passende Stellen zu finden, Kontakte zu Arbeitgebern herzustellen und mich wieder zurück in Arbeit aktiv zu unterstützen.',\n          '',\n          'Das Angebot von Anita Bösche / Externe-Personalabteilung.de passt sehr gut zu meiner aktuellen Situation und meinem Ziel, wieder in Arbeit zu kommen.',\n          'Anbieterin: Anita Bösche / Externe-Personalabteilung.de',\n          'Arbeitsagentur-Kundennummer der Anbieterin: A863B17231',\n          '',\n          'Ein AVGS-MPAV ist aus meiner Sicht gut investiert und ohne finanzielles Risiko, da eine Zahlung nur dann erfolgt, wenn tatsächlich eine erfolgreiche Vermittlung zustande kommt und ein Arbeitsvertrag abgeschlossen wird.',\n          '',\n          'Mein Ziel ist klar: Ich möchte wieder arbeiten und brauche dafür jetzt gezielte Unterstützung bei der Vermittlung in eine passende Beschäftigung.',\n          '',\n          'Ich bitte Sie daher um Prüfung, ob für mich ein AVGS-MPAV für private Arbeitsvermittlung / Jobvermittlung bewilligt werden kann.',\n          'Meine eigene Kd.-Nr. bei der Agentur für Arbeit lautet: [Ihre Kundennummer eintragen].',\n          'Vielen Dank.',\n          'Mit freundlichen Grüßen',\n          '[Ihr Vorname Nachname]'\n        );\n        const text = lines.join('\\n');\n        const feedback = () => {\n          btn.textContent = '✓ Brief kopiert!';\n          btn.style.background = '#2f8f4e';\n          setTimeout(() => { btn.textContent = '📋 Brief kopieren'; btn.style.background = '#c4691a'; }, 2200);\n        };\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText(text).then(feedback).catch(() => { this.fallbackCopy(text); feedback(); });\n        } else {\n          this.fallbackCopy(text); feedback();\n        }\n      }\n    };\n  }\n  fallbackCopy(text) {\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.style.position = 'fixed';\n    ta.style.top = '0';\n    ta.style.opacity = '0';\n    document.body.appendChild(ta);\n    ta.focus(); ta.select();\n    try { document.execCommand('copy'); } catch (err) {}\n    document.body.removeChild(ta);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
